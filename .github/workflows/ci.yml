name: CI

# Build, lint changed code, validate migrations, and unit-test every push and
# pull request.
#
# Needs no server, no Docker and no secrets: the unit suite is hermetic and the
# integration suite (which does need a running server) is deliberately excluded.
#
# `bun run lint` is not wired in here on purpose — see the note at the bottom.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  SYSTEMLLM_ENABLED: 'false'
  MXF_TEST_ALLOW_EXTERNAL_LLM_CALLS: 'false'

jobs:
  verify:
    name: Build, quality gates, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds the server and workspace packages, then typechecks the CLI/TUI
      # source that Bun executes directly.
      - name: Build and typecheck all runtime surfaces
        run: bun run build

      - name: Verify packed SDK public contract
        run: bun run verify:sdk-package

      - name: Lint changed TypeScript lines
        env:
          MXF_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run lint:changed

      - name: Validate migration manifest
        run: bun run check:migrations

      - name: Validate demo launch contracts
        run: bun run check:demos

      - name: Unit + property tests
        run: bun run test:unit:ci

  # Mutation testing is slow (~3 min) and gated on thresholds.break in
  # stryker.config.json, so it runs on demand rather than on every push.
  mutation:
    name: Mutation testing
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Stryker
        run: bun run test:mutation

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 14

# Why lint is scoped to changed lines:
#
# `bun run lint` (eslint .) currently reports ~4,600 pre-existing errors, almost
# all @typescript-eslint/no-explicit-any (~3,300) and no-unused-vars (~1,000),
# spread across packages/, src/, examples/ and tests/. The changed-line gate is
# blocking for both errors and warnings, so new work cannot add to that debt.
# Replace it with `bun run lint` once the legacy findings reach zero.
